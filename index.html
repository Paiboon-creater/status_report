<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAGUAR PRODUCTION STATUS REPORT // REALTIME LIVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- เพิ่มไลบรารี Supabase JS สำหรับระบบ Realtime -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #f0f4f8;
            --panel-bg: #ffffff;
            --border-neon: #cbd5e1;
            --border-dim: #e2e8f0;
            --text-main: #1e293b;
            --text-label: #475569;
            --text-muted: #64748b;
            --neon-green: #10b981;
            --neon-glow: rgba(16, 185, 129, 0.15);
            --neon-red: #ef4444;
            --neon-blue: #3b82f6;
            --input-bg: #f8fafc;
            --input-text: #1e293b;
            --table-bg: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            font-size: 16px;
        }

        .dashboard-container {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: #e0f2fe;
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neon-blue);
            font-size: 1.2rem;
        }

        .title-text h1 {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .title-text span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .refresh-status {
            font-size: 0.85rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 10px;
            font-weight: bold;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .pulse-dot.blue { background-color: var(--neon-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-btn {
            background: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            padding: 8px 15px;
        }
        
        .manual-btn { border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .manual-btn:hover { background: var(--neon-blue); color: #fff; }
        
        .home-btn { border: 1px solid #f59e0b; color: #f59e0b; }
        .home-btn:hover { background: #f59e0b; color: #fff; }

        .excel-btn { background: #10b981; border: 1px solid #059669; color: #fff; }
        .excel-btn:hover { background: #059669; }

        .filter-panel {
            background: #f8fafc;
            border: 1px solid var(--border-dim);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-controls-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            flex: 1;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-label);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-select-stock {
            background-color: var(--input-bg);
            border: 1px solid var(--border-neon);
            color: var(--input-text);
            border-radius: 6px;
            font-size: 0.95rem;
            padding: 8px 12px;
            width: 100%;
            transition: all 0.2s;
        }

        .form-select-stock:focus {
            background-color: #ffffff;
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .clear-btn {
            background: #ffffff;
            border: 1px solid #94a3b8;
            color: #475569;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            height: 38px;
        }

        .clear-btn:hover { background: #f1f5f9; color: #0f172a; }

        .form-switch .form-check-input {
            cursor: pointer;
            width: 2.5em;
            height: 1.25em;
        }
        .form-switch label { font-size: 0.9rem; color: var(--text-main); cursor: pointer; margin-top: 2px;}

        .status-legend {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-label);
            flex-wrap: wrap;
            width: 100%;
            margin-top: 10px;
            border-top: 1px dashed var(--border-dim);
            padding-top: 15px;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 16px; height: 16px; border-radius: 4px; }

        .theme-checkbox {
            appearance: none; -webkit-appearance: none;
            width: 20px; height: 20px; min-width: 20px;
            border: 2px solid #94a3b8;
            background-color: #ffffff;
            border-radius: 4px; cursor: pointer;
            position: relative; transition: all 0.2s ease;
            margin: 0; display: inline-block; vertical-align: middle;
        }
        .theme-checkbox:hover { border-color: var(--neon-blue); }
        .theme-checkbox:checked { background-color: var(--neon-blue); border-color: var(--neon-blue); }
        .theme-checkbox:checked::after {
            content: ''; position: absolute; left: 6px; top: 2px;
            width: 5px; height: 11px; border: solid #ffffff;
            border-width: 0 2px 2px 0; transform: rotate(45deg);
        }

        .table-container {
            width: 100%; overflow-x: auto; overflow-y: auto;
            background: var(--table-bg); border: 1px solid var(--border-dim);
            border-radius: 8px; max-height: 70vh; position: relative;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-dim); border-right: 1px solid var(--border-dim); }
        thead th { position: sticky; top: 0; background-color: #f8fafc; color: #334155; font-weight: bold; text-transform: uppercase; z-index: 10; border-bottom: 2px solid #cbd5e1; }
        tr:hover td { background-color: #f1f5f9; }

        .bg-status-green { background-color: #d1fae5 !important; color: #065f46 !important; font-weight: bold; }
        .bg-status-yellow { background-color: #fef3c7 !important; color: #92400e !important; font-weight: bold; }
        .bg-status-orange { background-color: #ffedd5 !important; color: #9a3412 !important; font-weight: bold; }
        .bg-status-red { background-color: #fee2e2 !important; color: #991b1b !important; font-weight: bold; }

        .text-center-col { text-align: center; }
        .text-right-col { text-align: right; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(4px);
        }
        .manual-box {
            width: 100%; max-width: 700px; max-height: 85vh;
            background: #ffffff; border: 2px solid var(--neon-blue);
            border-radius: 12px; padding: 25px; overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
        }
        .manual-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border-dim); padding-bottom: 15px; margin-bottom: 20px;
        }
        .manual-box h3 { color: var(--neon-blue); margin: 0; font-weight: bold;}
        .manual-box h5 { color: #0f172a; margin-top: 20px; margin-bottom: 10px; font-weight: bold;}
        .manual-box p, .manual-box li { font-size: 1rem; line-height: 1.6; }
        .manual-box ul { padding-left: 20px; margin-bottom: 15px;}
        .close-modal-btn {
            background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569;
            padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px;
        }
        .close-modal-btn:hover { background: var(--neon-red); color: #fff; border-color: var(--neon-red); }
    </style>
    
    <style id="dynamic-sticky-style"></style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-section">
        <div class="brand-title">
            <div class="brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div class="title-text">
                <h1>JAGUAR PRODUCTION STATUS REPORT</h1>
                <span>LIVE STOCK VIEW | SMART REAL-TIME SYNC</span>
            </div>
        </div>
        <div class="header-actions">
            <div class="refresh-status" id="syncStatus">
                <div class="pulse-dot"></div> CONNECTING...
            </div>
            <button class="nav-btn manual-btn" onclick="openManual()">
                <i class="fa-solid fa-book"></i> คู่
